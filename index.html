<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zatsudan</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="main-body">
      <div id="header">
        <a
          href="https://github.com/Denma14/Zatsudan"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="/images/githubIcon.png"
            alt="github repository"
            id="repo-image"
        /></a>

        <h1>Zatsudan</h1>

        <a
          href="https://github.com/Denma14/Zatsudan/blob/master/Terms.md"
          target="_blank"
          rel="noopener noreferrer"
          id="terms"
        >
          Terms & Rules
        </a>
      </div>

      <div id="disclaimer">
        <input type="button" id="disclaimer-exit" value="X" />
        <h1>
          Zatsudan is an open, anonymous chat platform. The operator is not
          responsible or liable for user-generated content.
        </h1>
      </div>

      <div id="text-display"></div>
      <div id="message-box">
        <input
          type="text"
          name="message-input-box"
          id="message-input"
          placeholder="Client type a message!"
        />
        <input
          for="message-input-box"
          type="button"
          value=">"
          id="submit-message"
        />
      </div>
    </div>
  </body>
</html>
